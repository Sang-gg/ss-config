#!name = Locket Gold
#!desc = Mở khóa Locket Gold qua RevenueCat
#!author = PanX 
[Script]
# Xóa ETag trên request — tránh server trả 304
deleteHeader = type=http-request,pattern=^https:\/\/api\.revenuecat\.com\/.+\/(receipts|subscribers),script-path=https://raw.githubusercontent.com/Sang-gg/ss-config/refs/heads/main/assets/deleteHeader.js,timeout=60

# Sửa response RevenueCat — gán entitlement Gold cho Locket
revenuecat = type=http-response,pattern=^https:\/\/api\.revenuecat\.com\/.+\/(receipts$|subscribers\/[^/]+$),requires-body=true,max-size=-1,timeout=60,script-path=https://raw.githubusercontent.com/Sang-gg/ss-config/refs/heads/main/assets/locket_id.js

[MITM]
hostname = api.revenuecat.com